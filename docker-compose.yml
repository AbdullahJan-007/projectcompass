services:
  db:
    image: pgvector/pgvector:pg16
    container_name: projectcompass-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: projectcompass
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d projectcompass"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
